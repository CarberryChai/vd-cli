[package]
name = "vd-cli"
version = "0.1.0"
edition = "2024"
description = "Bilibili 视频下载 CLI"
license = "MIT"

[[bin]]
name = "vd"
path = "src/main.rs"

[dependencies]
# 读取浏览器 Cookie：SQLite 库 + macOS 上 v10 密文的解密
aes = "0.8"
anyhow = "1"
base64 = "0.22"
cbc = "0.1"
hmac = "0.12"
pbkdf2 = "0.12"
rusqlite = { version = "0.37", features = ["bundled"] }
sha1 = "0.10"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
hex = "0.4"
indicatif = "0.17"
md-5 = "0.10"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "fs", "macros", "signal", "io-util", "time", "sync", "process"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"

[dev-dependencies]
aes = "0.8"
cbc = "0.1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
wiremock = "0.6"
